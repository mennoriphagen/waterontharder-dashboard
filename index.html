<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boshuis 150 Dashboard</title><style>:root{--bg:#0f172a;--panel:#1e293b;--panel2:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#3b82f6;--green:#22c55e;--orange:#f59e0b;--red:#ef4444}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Segoe UI,sans-serif}header{background:#020617;padding:20px;text-align:center;font-size:28px;font-weight:700}.tabs{display:flex;background:#111827}.tab{flex:1;text-align:center;padding:15px;cursor:pointer;border-bottom:3px solid transparent}.tab.active{border-color:var(--accent);background:#1e293b}.page{display:none;padding:20px;max-width:1400px;margin:auto}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-bottom:30px}.card{background:var(--panel);border-radius:16px;padding:20px}.label{color:var(--muted);font-size:13px}.value{margin-top:10px;font-size:32px;font-weight:700}.dashboard{display:flex;gap:40px;flex-wrap:wrap;justify-content:center}.tank{width:220px;height:420px;border:4px solid white;border-radius:25px;overflow:hidden;position:relative;background:#111827}.salt{position:absolute;bottom:0;width:100%;background:linear-gradient(to top,var(--green),#4ade80)}.percent{position:absolute;width:100%;top:50%;transform:translateY(-50%);text-align:center;font-size:42px;font-weight:bold}.progress{height:30px;background:#374151;border-radius:15px;overflow:hidden;margin-top:10px}.progress-fill{height:100%;background:var(--accent)}table{width:100%;border-collapse:collapse;background:var(--panel)}th{background:var(--panel2);padding:12px;text-align:left}td{padding:12px;border-bottom:1px solid #475569}.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.stat{background:var(--panel);padding:20px;border-radius:16px;text-align:center}.stat-value{font-size:42px;font-weight:bold}</style></head><body><header>💧 Boshuis 150 Waterontharder</header><div class="tabs"><div class="tab active" onclick="showTab(0)">Dashboard</div><div class="tab" onclick="showTab(1)">Regeneraties</div><div class="tab" onclick="showTab(2)">Zoutvullingen</div><div class="tab" onclick="showTab(3)">Statistieken</div></div><div class="page active"><div class="cards"><div class="card"><div class="label">Zoutniveau</div><div id="saltLevel" class="value"></div></div><div class="card"><div class="label">Resterend zout</div><div id="saltKg" class="value"></div></div><div class="card"><div class="label">Sinds zoutvulling</div><div id="waterUsed" class="value"></div></div><div class="card"><div class="label">Dagen sinds vullen</div><div id="daysUsed" class="value"></div></div></div><div class="dashboard"><div><div class="tank"><div id="saltFill" class="salt"></div><div id="tankPercent" class="percent"></div></div><div><h3>Capaciteit sinds regeneratie</h3><div class="progress"><div id="capacityFill" class="progress-fill"></div></div><p id="capacityText"></p></div></div><div><h2>Status</h2><p>Laatste regeneratie: <span id="lastRegen"></span></p><p>Verwachte navulling: <span id="prediction"></span></p><p>Aantal regeneraties: <span id="regenCount"></span></p></div></div></div><div class="page"><table><tbody id="regenTable"></tbody></table></div><div class="page"><table><tbody id="saltTable"></tbody></table></div><div class="page"><div class="stat-grid"><div class="stat"><div>Gemiddeld interval</div><div id="avgDays" class="stat-value"></div></div><div class="stat"><div>Gem. liter/regeneratie</div><div id="avgLiters" class="stat-value"></div></div></div></div><script>function showTab(i){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab')[i].classList.add('active');document.querySelectorAll('.page')[i].classList.add('active')}fetch('dashboard.json').then(r=>r.json()).then(data=>{saltLevel.innerText=data.zoutniveau+'%';saltKg.innerText=data.resterendKg+' kg';waterUsed.innerText=data.waterSindsZoutvulling+' m³';daysUsed.innerText=data.dagenSindsZoutvulling;tankPercent.innerText=data.zoutniveau+'%';saltFill.style.height=data.zoutniveau+'%';prediction.innerText=data.verwachteNavulling;lastRegen.innerText=data.laatsteRegeneratie;regenCount.innerText=data.regeneraties.length;let cap=(data.capaciteitLiter/data.capaciteitMax)*100;capacityFill.style.width=cap+'%';capacityText.innerText=data.capaciteitLiter+' / '+data.capaciteitMax+' liter';});</script></body></html>
