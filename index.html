<style>

:root{
 --bg:#08142e;
 --card:#1c2944;
 --header:#020c1d;
 --accent:#3b82f6;
 --green:#22c55e;
 --orange:#f59e0b;
 --red:#ef4444;
 --text:#f5f7fb;
 --muted:#9ca3af;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{
 background:var(--bg);
 color:var(--text);
 font-family:Segoe UI,sans-serif;
}

header{
 background:var(--header);
 text-align:center;
 padding:22px;
 font-size:18px;
 font-weight:700;
}

.tabs{
 display:flex;
 overflow-x:auto;
 background:#0d1a33;
 scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
 display:none;
}

.tab{
 flex:0 0 auto;
 min-width:140px;
 padding:16px;
 text-align:center;
 cursor:pointer;
 border-bottom:3px solid transparent;
 white-space:nowrap;
}

.tab.active{
 border-bottom:3px solid var(--accent);
 background:#1c2944;
}

.page{
 display:none;
 padding:15px;
 max-width:1200px;
 margin:auto;
}

.page.active{
 display:block;
}

.cards{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
 margin-bottom:25px;
}

.card{
 background:var(--card);
 border-radius:12px;
 padding:16px;
 min-height:90px;
}

.label{
 color:var(--muted);
 font-size:14px;
 margin-bottom:8px;
}

.value{
 font-size:28px;
 font-weight:700;
}

.dashboard{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:30px;
}

.tank{
 width:240px;
 height:420px;
 border:5px solid white;
 border-radius:28px;
 overflow:hidden;
 position:relative;
 background:#0d1a33;
}

.salt{
 position:absolute;
 left:0;
 bottom:0;
 width:100%;
 transition:1s;
}

.percent{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 font-size:48px;
 font-weight:bold;
}

.status{
 min-width:280px;
}

.status h2{
 margin-bottom:15px;
}

.status p{
 margin-bottom:8px;
}

.progress{
 height:34px;
 background:#374151;
 border-radius:17px;
 overflow:hidden;
 margin-top:10px;
}

.progress-fill{
 height:100%;
 width:0%;
 background:var(--accent);
 transition:1s;
}

table{
 width:100%;
 border-collapse:collapse;
 background:var(--card);
 border-radius:12px;
 overflow:hidden;
}

th{
 background:#2b3c61;
 text-align:left;
 padding:12px;
}

td{
 padding:12px;
 border-top:1px solid #334155;
}

.stat-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:15px;
}

.stat{
 background:var(--card);
 padding:20px;
 border-radius:16px;
 text-align:center;
}

.stat-value{
 font-size:32px;
 font-weight:bold;
 margin-top:8px;
}

.footer{
 margin-top:25px;
 text-align:center;
 color:#9ca3af;
 font-size:13px;
}

@media(max-width:768px){

 header{
  font-size:16px;
  padding:18px;
 }

 .cards{
  grid-template-columns:repeat(2,1fr);
  gap:10px;
 }

 .card{
  padding:14px;
  min-height:80px;
 }

 .label{
  font-size:12px;
  margin-bottom:6px;
 }

 .value{
  font-size:20px;
 }

 .tank{
  width:180px;
  height:320px;
 }

 .percent{
  font-size:38px;
 }

 .dashboard{
  flex-direction:column;
  align-items:center;
 }

 .status{
  min-width:unset;
  width:100%;
 }

 table{
  font-size:13px;
 }

 th,
 td{
  padding:8px;
 }

}

</style>
